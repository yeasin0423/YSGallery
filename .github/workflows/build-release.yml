name: Build release APK

# Builds the unsigned release APK on Linux with the same Java version as F-Droid's build server, so the result can
# be compared byte for byte with F-Droid's own build (reproducible build). The R8 code shrinker writes different
# line endings on Windows, so release builds meant for publishing are made here, not on a Windows PC.
# The APK is signed afterwards, on the maintainer's own computer; the signing key never leaves it.
# The unsigned APK is only uploaded as a workflow artifact - it is never attached to a GitHub release.
#
# This is the normal build: the Gradle wrapper downloads Gradle 8.9 from services.gradle.org and verifies
# its SHA-256. If that download is unavailable, run "Build release APK (mirror)" instead, which fetches
# the same archive from this repository's v2.7-b12 release.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the unsigned release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show checksums
        run: sha256sum app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Gallery-unsigned-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
